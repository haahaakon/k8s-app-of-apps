apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: what-is-my-ipv6
  namespace: what-is-my-ipv6
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: what-is-my-ipv6
    server: https://kubernetes.default.svc
  project: default
  source:
    path: manifests
    repoURL: https://github.com/haahaakon/what-is-my-ipv6
    targetRevision: HEAD
    directory:
      recurse: true
      jsonnet: {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
